spring.application.name=musicmania-backend
server.port=8080

# MySQL (se crea la BD "musicmania" si no existe)
spring.datasource.url=jdbc:mysql://localhost:3306/musicmania?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# Hibernate crea/actualiza las tablas automáticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Orígenes permitidos del front (Vite)
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000